<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sedna Survey Products</title>
  <style>
    :root {
      --sedna-deep: #0B2C3D;
      --sedna-teal: #1F5E6E;
      --sedna-gold: #D9A441;
      --panel: #ffffff;
      --ink: #16313f;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top right, #1f5e6e 0%, #0b2c3d 55%, #081f2b 100%);
      color: #f2f6f8;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: min(900px, 96vw);
      background: rgba(255,255,255,0.96);
      color: var(--ink);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
      border: 1px solid rgba(11,44,61,.14);
      overflow: hidden;
    }
    header {
      border-bottom: 3px solid var(--sedna-gold);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #f6fbfd;
    }
    header img { width: 140px; height: auto; }
    header h1 { margin: 0; font-size: 1.25rem; color: var(--sedna-deep); }
    header p { margin: 4px 0 0; color: var(--sedna-teal); font-size: .92rem; }
    main { padding: 18px 20px 20px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9fcfe;
      border: 1px solid rgba(31,94,110,.18);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .surveyName {
      font-weight: 600;
      color: var(--sedna-deep);
      padding-right: 12px;
      line-height: 1.3;
    }
    .links {
      display: inline-flex;
      gap: 10px;
      min-width: 110px;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
    }
    a { color: var(--sedna-deep); font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    span { color: var(--sedna-teal); font-size: .86rem; }
    .missing { color: #6f8c96; font-weight: 600; }
  </style>
</head>
<body>
  <section class="card">
    <header>
      <img src="outputs/assets/sedna_logo_transparent.png" alt="Sedna Robotics logo">
      <div>
        <h1>Sedna Survey Products</h1>
        <p>Survey charts and PDF reports</p>
      </div>
    </header>
    <main>
      <ul>
        <li><div class="surveyName">Warden 3 | 41.77°N, 70.32°W | 2026-09-02 07:00 to 2026-09-03 07:34</div><div class="links"><a href="outputs/warden-3_41p77n_70p32w_20260902T0700-20260903T0734_casts_chart.html">Chart</a><a href="outputs/warden-3_41p77n_70p32w_20260902T0700-20260903T0734_casts.pdf">PDF</a></div></li>
<li><div class="surveyName">Warden 2 | 41.81°N, 70.14°W | 2026-08-19 19:00 to 2026-08-21 07:35</div><div class="links"><a href="outputs/warden-2_41p81n_70p14w_20260819T1900-20260821T0735_casts_chart.html">Chart</a><a href="outputs/warden-2_41p81n_70p14w_20260819T1900-20260821T0735_casts.pdf">PDF</a></div></li>
      </ul>
    </main>
  </section>
</body>
</html>
