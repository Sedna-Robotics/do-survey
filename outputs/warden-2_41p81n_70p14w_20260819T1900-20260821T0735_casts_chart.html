shold": 0.3, "provenance": [["Data sources", ["Vehicle telemetry: InfluxDB Cloud bucket <code>warden</code>, callsign <code>warden-2</code>, measurements <code>global_position_int</code>, <code>winch_status</code>, <code>profile_sample</code>.", "Bathymetry: NOAA NCEI best-available DEM mosaic (<code>DEM_mosaics/DEM_all</code> ImageServer). In this area the mosaic is fed by the CUDEM 1/9 arc-second tiles <code>ncei19_n41x75/n42x00_w070x25/w070x50_2021v1</code>, exported at 1/3 arc-second (~10 m).", "Tides: NOAA CO-OPS predictions, station 8447241 Sesuit Harbor, East Dennis (41.7517\u00b0N, 70.1550\u00b0W), datum MLLW, metric, 6-minute interval.", "Vertical datum transform: NOAA VDatum, MLLW\u2192NAVD88 = -1.764 m (\u00b10.117 m) evaluated at the track centroid."]], ["Filtering and processing", ["<code>global_position_int</code> and <code>winch_status</code> reduced to 1 Hz server-side with <code>aggregateWindow(every: 1s, fn: last, createEmpty: false)</code>; <code>profile_sample</code> kept at its native 30 s rate.", "Winch line length and speed are linearly interpolated in time onto each DO sample timestamp; gaps longer than 30 s are left null.", "A reading is tagged <b>not on bottom</b> when |winch speed| &gt; 0.3 m/s or line length &lt; 1.5 m. Tagged readings are greyed out and excluded from the station minimum shown on the chart.", "Seabed elevation is sampled bilinearly from the DEM at each vessel fix."]], ["Assumptions and caveats", ["DEM elevations are treated as metres relative to NAVD88, the CUDEM vertical datum. <code>bathymetry_depth_m</code> is the negated seabed elevation; <code>tide_adjusted_depth_m</code> adds the predicted water level.", "Tides are <i>predicted</i> astronomical levels, not observed water levels: storm surge and wind setup are not represented.", "One tide station and one VDatum offset are applied across the whole survey area, so spatial variation in tidal phase, range and datum separation is ignored. Sesuit Harbor is a subordinate station, derived from a reference station rather than measured harmonics.", "Winch line length is used as the depth proxy for each reading. There is no wire angle or layback correction, so a reading's true depth is at most its line length.", "The Lowell Instruments DOT-2 logger does not report pressure (<code>profile_sample.pressure_dbar</code> is zero throughout), so no independent sensor depth is available as a check.", "Positions are the vessel GPS fix (<code>global_position_int</code>), not the position of the sensor itself. The vessel free-drifts during sensor deployment.", "Quoted uncertainty covers the VDatum transform only. DEM vertical uncertainty, tide prediction error and GPS error are not included.", "Where every reading at a station is tagged, no minimum on-bottom DO exists and the station is drawn grey."]]]};
const METERS_PER_FATHOM = 1.8288;
let lengthUnit = 'm';
let selectedCast = null;

function doColor(v) {
  if (v === null || v === undefined || isNaN(v)) return DATA.tagged;
  for (const [lower, color] of DATA.bins) if (v >= lower) return color;
  return DATA.belowZero;
}

function lengthLabel() {
  return lengthUnit === 'm' ? 'm' : 'fathoms';
}

function toDisplayLength(v) {
  if (v === null || v === undefined || isNaN(v)) return v;
  return lengthUnit === 'm' ? v : v / METERS_PER_FATHOM;
}

const chartMap = L.map('chartMap');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 13, attribution: 'Esri World Ocean Base' }).addTo(chartMap);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 13 }).addTo(chartMap);

const route = L.polyline(DATA.route, { color: '#0B2C3D', weight: 2.5, opacity: 0.95 }).addTo(chartMap);
chartMap.fitBounds(route.getBounds().pad(0.15));

DATA.casts.forEach(cast => {
  const marker = L.circleMarker([cast.lat, cast.lon], {
    radius: 10, color: '#0B2C3D', weight: 1,
    fillColor: doColor(cast.min_on_bottom_do), fillOpacity: 1
  }).addTo(chartMap);
  marker.bindTooltip(`Station ${cast.station}<br>min on-bottom DO: ` +
    (cast.min_on_bottom_do === null ? 'n/a' : cast.min_on_bottom_do.toFixed(2) + ' mg/L'));
  marker.on('click', () => showCast(cast));
  L.marker([cast.lat, cast.lon], { interactive: false,
    icon: L.divIcon({ className: 'stationLabel', html: cast.station, iconSize: [16, 16] }) }).addTo(chartMap);
});

function showCast(cast) {
  selectedCast = cast;
  const pts = cast.samples.filter(s => s.line !== null);
  const yVals = pts.map(s => toDisplayLength(s.line));
  const bathyRaw = toDisplayLength(cast.bathy_raw);
  const bathyTide = toDisplayLength(cast.bathy_tide);
  const unit = lengthLabel();
  const traces = [{
    x: pts.map(s => s.do), y: yVals, mode: 'lines', line: { color: '#bbb', width: 1 },
    hoverinfo: 'skip', showlegend: false
  }, {
    x: pts.map(s => s.do), y: yVals, mode: 'markers+text',
    text: pts.map(s => s.n), textposition: 'middle center',
    textfont: { size: 8, color: '#fff' },
    marker: { size: 18, color: pts.map(s => s.tagged ? DATA.tagged : doColor(s.do)),
              line: { color: '#333', width: 1 } },
    customdata: pts.map(s => [s.speed, s.tagged ? 'not on bottom' : 'on bottom']),
    hovertemplate: '#%{text}<br>DO %{x:.2f} mg/L<br>line %{y:.2f} ' + unit +
                   '<br>winch %{customdata[0]:.2f} m/s (%{customdata[1]})<extra></extra>',
    showlegend: false
  }];
  const shapes = [
    { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: bathyRaw, y1: bathyRaw,
      line: { color: '#1f4e79', width: 1, dash: 'dash' } },
    { type: 'line', xref: 'paper', x0: 0, x1: 1, y0: bathyTide, y1: bathyTide,
      line: { color: '#1f4e79', width: 1.5, dash: 'dot' } }
  ];
  const annotations = [
    { xref: 'paper', x: 0.02, y: bathyRaw, text: `bathy ${bathyRaw.toFixed(1)} ${unit}`,
      showarrow: false, font: { size: 9, color: '#1f4e79' }, yanchor: 'bottom', xanchor: 'left' },
    { xref: 'paper', x: 0.98, y: bathyTide, text: `tide-corrected ${bathyTide.toFixed(1)} ${unit}`,
      showarrow: false, font: { size: 9, color: '#1f4e79' }, yanchor: 'top', xanchor: 'right' }
  ];
  document.getElementById('inset').style.display = 'block';
  Plotly.newPlot('chart', traces, {
    title: { text: `Station ${cast.station} — ${cast.lat.toFixed(4)}\u00b0N, ${Math.abs(cast.lon).toFixed(4)}\u00b0W<br>` +
                   `<span style="font-size:10px">${cast.time}</span>`, font: { size: 12 } },
    margin: { l: 55, r: 20, t: 55, b: 45 },
    xaxis: { title: { text: 'Dissolved oxygen (mg/L)', font: { size: 11 } } },
    yaxis: { title: { text: `Line length (${unit})`, font: { size: 11 } }, autorange: 'reversed' },
    shapes: shapes, annotations: annotations
  }, { displayModeBar: false, responsive: true }).then(() => Plotly.Plots.resize('chart'));
}

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<b>DO</b><br>' +
    DATA.bins.slice().reverse().map(b => `<i style="background:${b[1]}"></i>${b[2]}`).join('<br>') +
    '<br><b>Route</b> <span style="border-top:2px solid #0B2C3D;display:inline-block;width:20px;"></span>';
  return div;
};
legend.addTo(chartMap);

const units = L.control({ position: 'topright' });
units.onAdd = () => {
  const div = L.DomUtil.create('div', 'unitCtrl');
  div.innerHTML = '<strong>Length units</strong><br>' +
    '<label><input type="radio" name="length-unit" value="m" checked> meters</label>' +
    '<label><input type="radio" name="length-unit" value="fathoms"> fathoms</label>';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
units.addTo(chartMap);

document.querySelectorAll('input[name="length-unit"]').forEach(el => {
  el.addEventListener('change', (evt) => {
    lengthUnit = evt.target.value;
    if (selectedCast) showCast(selectedCast);
  });
});

document.getElementById('aboutBody').innerHTML = DATA.provenance
  .map(([title, items]) => `<h3>${title}</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`).join('');

const info = L.control({ position: 'bottomright' });
info.onAdd = () => {
  const div = L.DomUtil.create('div', 'infoBtn');
  div.innerHTML = 'i';
  div.title = 'Sources, filtering and assumptions';
  L.DomEvent.disableClickPropagation(div);
  div.onclick = () => { document.getElementById('about').style.display = 'block'; };
  return div;
};
info.addTo(chartMap);
</script>
</body>
</html>
